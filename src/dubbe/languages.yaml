# Central Asian languages Chatterbox does not speak: free models measured on FLEURS dev, 20 sentences each (test-results C43)
uz:
  name: Uzbek
  whisper: uz
  asr_model: islomov/rubaistt_v2_medium   # Apache-2.0 Whisper fine-tune, converted once for faster-whisper (asr.whisper_model): CER 3.1 % vs 25.2 % large-v3
  nllb: uzn_Latn   # Latin script, which Navoiy reads
  sentence_end: '[.?!]$'
  join: " "
  tts:
    engine: navoiy   # Navoiy TTS (Apache-2.0): CosyVoice 2 + Uzbek weights, in .venv-cosyvoice; round-trip CER 3.1 %, 10 trained emotions
    voice: af_heart
    lang: uz
    clone: navoiy
    voices: *english_presets   # their Kokoro recordings are the reference voices, as for Korean
    fallback: {engine: mms, voice: facebook/mms-tts-uzb-script_cyrillic, lang: uz,   # without .venv-cosyvoice; reads Cyrillic (uzbek.to_cyrillic), 2.7 % CER; CC BY-NC 4.0
               voices: {facebook/mms-tts-uzb-script_cyrillic: {f0: 115, register: lower}}}
kk:
  name: Kazakh
  whisper: kk
  asr_model: large-v3-turbo   # CER 3.7 % vs 5.8 % for large-v3
  nllb: kaz_Cyrl
  sentence_end: '[.?!]$'
  join: " "
  tts:   # Piper (MIT), ISSAI voice (CC BY 4.0), CPU: round-trip CER 7.3 % vs MMS 11.7 %. No reference recording: no cloning, no acted emotions
    engine: piper
    model: kk/kk_KZ/issai/high/kk_KZ-issai-high
    voice: issai-0
    lang: kk
    voices:   # its 6 speakers; f0 measured on 3 FLEURS sentences each
      issai-0: {f0: 138, register: higher, name: Kazakh 1, accent: Piper}
      issai-1: {f0: 114, register: lower, name: Kazakh 2, accent: Piper}
      issai-2: {f0: 204, register: higher, name: Kazakh 3, accent: Piper}
      issai-3: {f0: 202, register: higher, name: Kazakh 4, accent: Piper}
      issai-4: {f0: 204, register: higher, name: Kazakh 5, accent: Piper}
      issai-5: {f0: 174, register: higher, name: Kazakh 6, accent: Piper}
