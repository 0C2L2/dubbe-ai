      bm_fable: {f0: 128, register: lower}
      bm_george: {f0: 126, register: lower}
      bm_lewis: {f0: 91, register: lower}

# The other languages Chatterbox Multilingual speaks, with the same voices as Korean (its built-in voice and the English
# presets; pitch measured on Korean speech). Recognition (Whisper) and translation (NLLB) cover them all; measured on
# FLEURS in test-results C25. Hebrew left out (C25). Japanese and Chinese words are joined without spaces.
ar:
  name: Arabic
  whisper: ar
  nllb: arb_Arab
  sentence_end: '[.?!؟]$'
  join: " "
  tts: {engine: chatterbox_ml, voice: built-in, lang: ar, clone: chatterbox_ml, voices: *chatterbox_voices}
