# Everything language-specific lives here. Adding a language = adding one entry.

defaults:
  close_pause: 0.3   # s of silence needed after a sentence ending to close the sentence
  break_pause: 0.8   # s of silence that closes a sentence on its own
  max_dur: 15.0      # longer sentences are split at their longest pause
  max_words: 40
  min_dur: 1.0       # shorter fragments are merged into a neighbour
  max_stretch: 1.3   # project tab: beyond ~1.3x sped-up speech sounds wrong
  shorten_min_conf_ratio: 0.85  # shorter alternative translation must keep >= 85% of the best confidence
  max_video_slow: 1.0  # >1 (e.g. 1.2) slows the picture where dubbed speech is longer, so speech is sped up less;
                       # barely visible on slides/talking heads, noticeable on action (--slow-video 1.2)
  register_split_hz: 122  # lower vs higher voice; calibrated on FLEURS ko, 95% on held-out FLEURS en (C10)
  speaker_threshold: 0.3  # speaker detection (C7): cosine distance between sentence voice fingerprints; test-results C21
  keep_background: true   # separate music/effects and keep them under the dub (--no-background to skip)
  background_floor_db: 35  # background stem this far below the original = only separation residue -> voice-only mix
  silence_db: -60    # ASR words quieter than this are dropped (Whisper invents text over silence)
  # natural delivery (timing stage, test-results C20)
  follow_delivery: true  # each dubbed sentence follows the original's loudness and pitch relative to the speaker
  delivery_max_db: 6     # at most this much louder / softer than the dub's median sentence
  delivery_pitch: 0.5    # share of the original sentence's pitch movement (semitones) given to the dub ...
  delivery_max_st: 1.5   # ... at most this much
  # delivery tags heard in the original (emotion stage, test-results C22); a reviewer's tags always win
  auto_tags: true
  emotion_min: 0.9   # emotion model this sure -> [excited] [angry] [sad]: 82 % of its tags right on CREMA-D (34 % found)
  sound_min: 0.3     # AudioSet probability -> [laugh] [sigh] [gasp] [cough] [whisper]; narration / read speech stayed < 0.2
  # review flags - first guesses, tune on the gold set (test plan T-07)
  min_asr_conf: 0.8  # mean word probability
  min_mt_conf: 0.6   # NLLB 3.3B mean token probability; flags 34 % of ko->en test sentences (33 % with 600M at 0.5), chrF++ 42 flagged vs 56 not (C23)
  max_overflow: 0.05 # s past the next segment's start
  # price ASSUMPTIONS for the cost stats (test plan T-11) - edit for your setup and cite sources in the report
  cost:
    gpu_watts: 115                 # RTX 4060 Laptop maximum power; treated as drawn the whole run (upper bound)
    electricity_usd_per_kwh: 0.15  # assumption
    cloud_gpu_usd_per_hour: 0.35   # assumption: on-demand T4-class cloud GPU
    elevenlabs_usd_per_min: [0.33, 2.20]  # ElevenLabs Dubbing API range quoted in project tab C2b

ko:
  name: Korean
  whisper: ko
  asr_model: large-v3   # read Korean (FLEURS, 100): CER 5.3 % vs 7.7 % turbo; conversation (KsponSpeech, 150): 11.7 vs 11.5 %; 2x slower (C23)
  nllb: kor_Hang
  min_mt_conf: 0.5   # Korean output scores lower: flags 41 % of en->ko test sentences (43 % with 600M at 0.35), chrF++ 27 flagged vs 37 not (C23)
  sentence_end: '[.?!]$|(다|요|까|죠)$'
  join: " "
  tts:
    engine: chatterbox_ml   # Chatterbox Multilingual (MIT) in .venv-chatterbox, built-in voice only (no prompt = no cloning);
    voice: built-in         # Whisper round-trip CER 4.1 % vs MMS 15.3 %; 5.1 s per sentence on the RTX 4060 (C9a, 2026-10-15)
    lang: ko
    clone: chatterbox_ml   # a consented voice clone (web/clones.py) speaks Korean with Multilingual
    voices: &chatterbox_voices   # built-in: measured with voice.median_f0, no f/m label. The rest: the English presets speaking Korean (Chatterbox
              # Multilingual with a Kokoro reference, tts.preset_prompt): Whisper heard 8 Korean sentences as well as the built-in voice
              # (2.3 % CER) for 20, 3-6 % for bm_daniel, bm_george, af_aoede, af_heart, af_bella; af_alloy left out at first (29 %, babbles
              # after the sentence). f0 measured on their Korean speech; register = the preset's own label (test-results C24)
      built-in: {f0: 113, register: lower}
      <<: &english_presets
        af_alloy: {f0: 137, register: higher, prompt: kokoro}   # back 2026-10-19 with tts.cut_babble: Korean 29.3 -> 8.1 %, Spanish 4.2 % (C24)
        af_aoede: {f0: 154, register: higher, prompt: kokoro}
        af_bella: {f0: 170, register: higher, prompt: kokoro}
        af_heart: {f0: 170, register: higher, prompt: kokoro}
        af_jessica: {f0: 177, register: higher, prompt: kokoro}
        af_kore: {f0: 134, register: higher, prompt: kokoro}
        af_nova: {f0: 147, register: higher, prompt: kokoro}
        af_river: {f0: 160, register: higher, prompt: kokoro}
        af_sarah: {f0: 163, register: higher, prompt: kokoro}
        af_sky: {f0: 143, register: higher, prompt: kokoro}
        am_adam: {f0: 111, register: lower, prompt: kokoro}
        am_echo: {f0: 104, register: lower, prompt: kokoro}
        am_eric: {f0: 136, register: lower, prompt: kokoro}
        am_fenrir: {f0: 118, register: lower, prompt: kokoro}
        am_liam: {f0: 115, register: lower, prompt: kokoro}
        am_michael: {f0: 114, register: lower, prompt: kokoro}
        am_onyx: {f0: 91, register: lower, prompt: kokoro}
        am_puck: {f0: 105, register: lower, prompt: kokoro}
        bf_alice: {f0: 167, register: higher, prompt: kokoro}
        bf_emma: {f0: 165, register: higher, prompt: kokoro}
        bf_isabella: {f0: 174, register: higher, prompt: kokoro}
        bf_lily: {f0: 160, register: higher, prompt: kokoro}
        bm_daniel: {f0: 115, register: lower, prompt: kokoro}
        bm_fable: {f0: 112, register: lower, prompt: kokoro}
        bm_george: {f0: 124, register: lower, prompt: kokoro}
        bm_lewis: {f0: 99, register: lower, prompt: kokoro}
    fallback: {engine: mms, voice: facebook/mms-tts-kor, voices: {facebook/mms-tts-kor: {f0: 170, register: higher}}}   # when .venv-chatterbox is missing; MMS-TTS, CC BY-NC 4.0

en:
  name: English
  whisper: en
  nllb: eng_Latn
  sentence_end: '[.?!]$'
  join: " "
  tts:
    engine: kokoro
    voice: af_heart   # used when voice matching has no library
    clone: chatterbox        # a consented voice clone (web/clones.py) speaks English with Turbo
    expressive: chatterbox   # whole video switches to Chatterbox Turbo (built-in voice) when a reviewer adds a vocal tag it can do; needs .venv-chatterbox
    voices:   # measured median pitch (scripts/tag_voices.py); register = the preset's own f/m label, not pitch
      # left out: af_nicole (whispering style), am_santa (novelty voice)
      af_alloy: {f0: 138, register: higher}
      af_aoede: {f0: 157, register: higher}
      af_bella: {f0: 123, register: higher}
      af_heart: {f0: 159, register: higher}
      af_jessica: {f0: 175, register: higher}
      af_kore: {f0: 123, register: higher}
      af_nova: {f0: 156, register: higher}
      af_river: {f0: 170, register: higher}
      af_sarah: {f0: 162, register: higher}
      af_sky: {f0: 130, register: higher}
      am_adam: {f0: 116, register: lower}
      am_echo: {f0: 110, register: lower}
      am_eric: {f0: 152, register: lower}
      am_fenrir: {f0: 130, register: lower}
      am_liam: {f0: 115, register: lower}
      am_michael: {f0: 106, register: lower}
      am_onyx: {f0: 90, register: lower}
      am_puck: {f0: 111, register: lower}
      bf_alice: {f0: 180, register: higher}
      bf_emma: {f0: 173, register: higher}
      bf_isabella: {f0: 171, register: higher}
